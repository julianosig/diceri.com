<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 1 91 96">
  <title>Diceri</title>
  <!--
    The Diceri mark (a twenty-sided die that is also a speech bubble), same facets as
    Logo.svelte, in one colour that follows the browser theme: brand blue on light tabs,
    white on dark ones. The lines between facets are cut out with a mask, so they show
    the tab's own colour whatever it is.
  -->
  <style>
    .mark { fill: #2563eb; }
    @media (prefers-color-scheme: dark) { .mark { fill: #ffffff; } }
  </style>
  <defs>
    <mask id="facets" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
      <g fill="none" stroke="#000000" stroke-width="3" stroke-linejoin="round">
      <polygon points="50,4 10,27 28,34"/>
      <polygon points="50,4 28,34 72,34"/>
      <polygon points="50,4 72,34 90,27"/>
      <polygon points="10,27 10,70 28,34"/>
      <polygon points="28,34 72,34 50,64"/>
      <polygon points="90,27 72,34 90,70"/>
      <polygon points="10,70 28,34 50,64"/>
      <polygon points="90,70 72,34 50,64"/>
      <polygon points="10,70 50,64 50,94"/>
      <polygon points="90,70 50,64 50,94"/>
      <polygon points="10,70 32,84 5,97"/>
      </g>
    </mask>
  </defs>
  <g class="mark" mask="url(#facets)">
      <polygon points="50,4 10,27 28,34"/>
      <polygon points="50,4 28,34 72,34"/>
      <polygon points="50,4 72,34 90,27"/>
      <polygon points="10,27 10,70 28,34"/>
      <polygon points="28,34 72,34 50,64"/>
      <polygon points="90,27 72,34 90,70"/>
      <polygon points="10,70 28,34 50,64"/>
      <polygon points="90,70 72,34 50,64"/>
      <polygon points="10,70 50,64 50,94"/>
      <polygon points="90,70 50,64 50,94"/>
      <polygon points="10,70 32,84 5,97"/>
  </g>
</svg>
