<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>
			Diceri — The Google Meet alternative where you talk and listen in your own language
		</title>
		<meta
			name="description"
			content="The Google Meet alternative where you talk and listen in your own language. Everyone in the meeting hears your voice in their language. Free and open source."
		/>
		<!-- Link previews (WhatsApp, Facebook, LinkedIn, X, Telegram, Slack, Discord): their
			crawlers do not run JavaScript, so these must be in the static page. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Diceri" />
		<meta property="og:title" content="Diceri — The Google Meet alternative" />
		<meta
			property="og:description"
			content="The Google Meet alternative where you talk and listen in your own language. Everyone in the meeting hears your voice in their language. Free and open source."
		/>
		<meta property="og:image" content="https://diceri.com/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Two people on a call with Diceri in the middle: the Google Meet alternative where you talk and listen in your own language."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Diceri — The Google Meet alternative" />
		<meta
			name="twitter:description"
			content="The Google Meet alternative where you talk and listen in your own language. Everyone in the meeting hears your voice in their language. Free and open source."
		/>
		<meta name="twitter:image" content="https://diceri.com/og.png" />
		<meta name="theme-color" content="#0d1016" />
		<link rel="alternate" type="text/markdown" href="/index.md" />
		<link rel="describedby" type="text/plain" href="/llms.txt" />
		<script>
			// Apply the theme before first paint (no flash): saved choice, else the system's.
			// Mirrors THEME_STORAGE_KEY in src/lib/components/ui/theme.svelte.ts.
			try {
				var saved = localStorage.getItem('diceri-theme');
				var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
